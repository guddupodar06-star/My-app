<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Emoji Photo Maker — By Guddu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1b0716 0%, #0f172a 100%);
      color: #f8fafc;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    h1 {
      text-align: center;
      color: #ff758f;
      font-size: 24px;
      margin-bottom: 4px;
    }

    .sub {
      text-align: center;
      color: #94a3b8;
      font-size: 13.5px;
      margin-bottom: 20px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
    }

    label {
      display: block;
      font-size: 12.5px;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type="file"],
    select,
    input[type="range"] {
      width: 100%;
      color: #f8fafc;
    }

    select {
      padding: 8px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid #475569;
      font-size: 13.5px;
    }

    .btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    button {
      flex: 1;
      min-width: 130px;
      padding: 11px 14px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
    }

    .btn-make {
      background: #e11d48;
    }

    .btn-make:hover {
      background: #be123c;
    }

    .btn-copy {
      background: #2563eb;
    }

    .btn-copy:hover {
      background: #1d4ed8;
    }

    .btn-wa {
      background: #16a34a;
    }

    .btn-wa:hover {
      background: #15803d;
    }

    .result-box {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      overflow-x: auto;
      max-height: 460px;
      overflow-y: auto;
    }

    pre#emojiArt {
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", monospace;
      font-size: 8px;
      line-height: 1.05;
      letter-spacing: 0;
      white-space: pre;
      text-align: center;
      color: #fff;
    }

    .hint {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 10px;
      text-align: center;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💖 Heart Emoji Photo Maker</h1>
    <p class="sub">Apni photo upload karein — dil wale emojis se face banega!</p>

    <div class="controls">
      <div class="box">
        <label for="photoInput">1. Photo Chunein</label>
        <input type="file" id="photoInput" accept="image/*" />
      </div>

      <div class="box">
        <label for="detailRange">2. Detail / Size: <span id="detailVal">55</span></label>
        <input type="range" id="detailRange" min="30" max="85" value="55" oninput="updateDetailLabel()" />
      </div>

      <div class="box">
        <label for="heartTheme">3. Heart Style</label>
        <select id="heartTheme">
          <option value="love">Red & Pink Love (🖤❤️💖🩷🤍)</option>
          <option value="rainbow">Colorful Hearts (🖤💜💙💚💛🤍)</option>
          <option value="warm">Warm Sunset (🖤🤎❤️🧡💛🤍)</option>
        </select>
      </div>
    </div>

    <div class="btns">
      <button class="btn-make" onclick="makeHeartArt()">Heart Face Banao</button>
      <button class="btn-copy" onclick="copyArt()">Copy Emojis</button>
      <button class="btn-wa" onclick="shareArt()">WhatsApp</button>
    </div>

    <div class="result-box">
      <pre id="emojiArt">Yahan photo upload karke "Heart Face Banao" par click karein...</pre>
    </div>

    <p class="hint">Tip: Clear face ke liye ache light wali photo aur Detail 50–65 ke beech rakhein. Made by Guddu.</p>

    <canvas id="workCanvas"></canvas>
  </div>

  <script>
    const themes = {
      // Darkest to brightest
      love: ["🖤", "❤️", "💖", "🩷", "🤍"],
      rainbow: ["🖤", "💜", "💙", "💚", "💛", "🤍"],
      warm: ["🖤", "🤎", "❤️", "🧡", "💛", "🤍"]
    };

    let loadedImg = null;

    function updateDetailLabel() {
      document.getElementById("detailVal").innerText = document.getElementById("detailRange").value;
      if (loadedImg) makeHeartArt();
    }

    document.getElementById("photoInput").addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (event) {
        const img = new Image();
        img.onload = function () {
          loadedImg = img;
          makeHeartArt();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function makeHeartArt() {
      if (!loadedImg) {
        alert("Pehle ek photo select karein!");
        return;
      }

      const cols = parseInt(document.getElementById("detailRange").value, 10);
      const themeKey = document.getElementById("heartTheme").value;
      const palette = themes[themeKey];

      // Aspect ratio adjust taaki face stretch na ho
      const aspectRatio = loadedImg.height / loadedImg.width;
      const rows = Math.max(15, Math.round(cols * aspectRatio * 0.95));

      const canvas = document.getElementById("workCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = cols;
      canvas.height = rows;

      ctx.drawImage(loadedImg, 0, 0, cols, rows);
      const pixels = ctx.getImageData(0, 0, cols, rows).data;

      let artLines = [];
      for (let y = 0; y < rows; y++) {
        let line = "";
        for (let x = 0; x < cols; x++) {
          const idx = (y * cols + x) * 4;
          const r = pixels[idx];
          const g = pixels[idx + 1];
          const b = pixels[idx + 2];

          // Brightness (0 = dark, 255 = bright)
          const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
          const levelIndex = Math.min(
            palette.length - 1,
            Math.floor((brightness / 256) * palette.length)
          );
          line += palette[levelIndex];
        }
        artLines.push(line);
      }

      const finalArt = artLines.join("\n");
      const preEl = document.getElementById("emojiArt");
      preEl.innerText = finalArt;

      // Mobile screen ke hisaab se font size thoda adjust
      const computedFontSize = Math.max(5, Math.min(11, Math.floor(340 / cols)));
      preEl.style.fontSize = computedFontSize + "px";
    }

    function copyArt() {
      const text = document.getElementById("emojiArt").innerText;
      if (!text || text.includes("Yahan photo upload")) {
        alert("Pehle heart face generate karein!");
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        alert("Heart emoji art copy ho gaya!");
      }).catch(() => {
        alert("Copy nahi ho paaya, manually select karke copy karein.");
      });
    }

    function shareArt() {
      const text = document.getElementById("emojiArt").innerText;
      if (!text || text.includes("Yahan photo upload")) {
        alert("Pehle heart face generate karein!");
        return;
      }
      if (text.length > 2500) {
        alert("Art ka size thoda bada hai—WhatsApp mein cut sakta hai. 'Copy Emojis' use karke paste karein ya Detail slider kam (35–45) rakhein.");
        return;
      }
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    }
  </script>

</body>
</html>
