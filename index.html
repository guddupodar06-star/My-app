<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Special Surprise For You ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #2b0a1e 0%, #0f0714 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Floating background hearts */
    .bg-heart {
      position: fixed;
      bottom: -30px;
      font-size: 20px;
      opacity: 0.6;
      animation: floatUp 5s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0.7; }
      100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
    }

    /* Stage 1: Gift Box */
    .gift-stage {
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s ease, opacity 0.4s ease;
    }

    .gift-stage:active {
      transform: scale(0.95);
    }

    .gift-box {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto 22px;
      animation: bounceBox 1.6s infinite ease-in-out;
    }

    @keyframes bounceBox {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-10px) rotate(-2deg); }
      75% { transform: translateY(-6px) rotate(2deg); }
    }

    .lid {
      position: absolute;
      top: 0;
      left: -8px;
      width: 166px;
      height: 36px;
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      border-radius: 8px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
      z-index: 3;
      transition: transform 0.6s ease, opacity 0.5s ease;
    }

    .lid::before {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 100%;
      background: #ffd166;
    }

    .bow {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      z-index: 4;
      transition: transform 0.6s ease, opacity 0.5s ease;
    }

    .box-body {
      position: absolute;
      top: 34px;
      left: 0;
      width: 150px;
      height: 116px;
      background: linear-gradient(135deg, #ff758f, #d90429);
      border-radius: 0 0 12px 12px;
      box-shadow: 0 15px 35px rgba(255, 77, 109, 0.45);
    }

    .box-body::before {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 100%;
      background: #ffd166;
    }

    .gift-open .lid {
      transform: translateY(-70px) rotate(-18deg);
      opacity: 0;
    }

    .gift-open .bow {
      transform: translate(-50%, -85px) scale(1.3);
      opacity: 0;
    }

    .tap-text {
      font-size: 20px;
      font-weight: 700;
      color: #ffb3c1;
      letter-spacing: 0.5px;
    }

    .tap-sub {
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 6px;
    }

    /* Stage 2: Love / Hate Card */
    .card-stage {
      display: none;
      background: rgba(30, 16, 36, 0.92);
      border: 1px solid rgba(255, 117, 143, 0.45);
      border-radius: 20px;
      padding: 28px 22px;
      width: 100%;
      max-width: 390px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(255, 77, 109, 0.3);
      animation: popIn 0.5s ease forwards;
      position: relative;
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .big-heart {
      font-size: 54px;
      margin-bottom: 10px;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .card-stage h2 {
      font-size: 23px;
      color: #ffccd5;
      margin-bottom: 8px;
    }

    .card-stage p {
      font-size: 14px;
      color: #e2e8f0;
      margin-bottom: 24px;
    }

    .btn-arena {
      position: relative;
      height: 150px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 14px;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn-love {
      background: linear-gradient(135deg, #ff4d6d, #ff0a54);
      color: #fff;
      box-shadow: 0 6px 18px rgba(255, 10, 84, 0.45);
      z-index: 2;
    }

    .btn-love:active {
      transform: scale(0.95);
    }

    .btn-hate {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #64748b;
      position: relative;
      z-index: 5;
      transition: left 0.18s ease, top 0.18s ease;
    }

    .tease-msg {
      font-size: 12.5px;
      color: #ff8fa3;
      min-height: 20px;
      margin-top: 8px;
      font-weight: 600;
    }

    /* Stage 3: Final Celebration */
    .final-stage {
      display: none;
      text-align: center;
      background: rgba(30, 16, 36, 0.95);
      border: 1px solid #ff4d6d;
      border-radius: 20px;
      padding: 32px 22px;
      max-width: 390px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(255, 77, 109, 0.4);
      animation: popIn 0.5s ease forwards;
    }

    .final-stage h2 {
      font-size: 25px;
      color: #ff8fa3;
      margin: 12px 0 10px;
    }

    .final-stage p {
      font-size: 15px;
      color: #f8fafc;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Stage 1: Gift Box -->
  <div class="gift-stage" id="giftStage" onclick="openGift()">
    <div class="gift-box" id="giftBox">
      <div class="bow">🎀</div>
      <div class="lid"></div>
      <div class="box-body"></div>
    </div>
    <div class="tap-text">Ek Surprise Gift Hai! 🎁</div>
    <div class="tap-sub">Kholne ke liye box par tap karein</div>
  </div>

  <!-- Stage 2: Interactive Card -->
  <div class="card-stage" id="cardStage">
    <div class="big-heart">💖</div>
    <h2>Sach-Sach Batana...</h2>
    <p>Tumhare dil mein mere liye kya hai?</p>

    <div class="btn-arena" id="arena">
      <button class="btn btn-love" id="loveBtn" onclick="chooseLove()">I Love You ❤️</button>
      <button class="btn btn-hate" id="hateBtn">I Hate You 💔</button>
    </div>

    <div class="tease-msg" id="teaseMsg"></div>
  </div>

  <!-- Stage 3: Final Message -->
  <div class="final-stage" id="finalStage">
    <div style="font-size: 60px;">🥰❤️🎉</div>
    <h2>I Love You Too!</h2>
    <p>Mujhe pehle se pata tha tum yahi chunoge! Tum mere liye bahut special ho. ❤️</p>
  </div>

  <script>
    const teaseLines = [
      "Arre! Yeh button pakad mein nahi aayega 😜",
      "Nice try! Dusra wala dabao ❤️",
      "Yeh option band ho chuka hai 😂",
      "Itni jaldi haar mat maano, par click nahi hoga 🏃‍♂️💨",
      "Bas I Love You hi kaam karega 🥰"
    ];
    let teaseIndex = 0;

    function openGift() {
      const box = document.getElementById("giftBox");
      box.classList.add("gift-open");

      setTimeout(() => {
        document.getElementById("giftStage").style.display = "none";
        document.getElementById("cardStage").style.display = "block";
      }, 550);
    }

    const hateBtn = document.getElementById("hateBtn");
    const arena = document.getElementById("arena");

    function dodgeButton(e) {
      if (e) e.preventDefault();

      const arenaRect = arena.getBoundingClientRect();
      const btnWidth = hateBtn.offsetWidth;
      const btnHeight = hateBtn.offsetHeight;

      const maxX = Math.max(10, arenaRect.width - btnWidth - 10);
      const maxY = Math.max(10, arenaRect.height - btnHeight - 10);

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      hateBtn.style.position = "absolute";
      hateBtn.style.left = randomX + "px";
      hateBtn.style.top = randomY + "px";

      document.getElementById("teaseMsg").innerText = teaseLines[teaseIndex % teaseLines.length];
      teaseIndex++;
    }

    // Mobile touch aur desktop hover dono par bhaagega
    hateBtn.addEventListener("touchstart", dodgeButton, { passive: false });
    hateBtn.addEventListener("mouseover", dodgeButton);
    hateBtn.addEventListener("click", dodgeButton);

    function chooseLove() {
      document.getElementById("cardStage").style.display = "none";
      document.getElementById("finalStage").style.display = "block";
      for (let i = 0; i < 20; i++) {
        setTimeout(spawnHeart, i * 120);
      }
    }

    function spawnHeart() {
      const heart = document.createElement("div");
      heart.className = "bg-heart";
      heart.innerText = ["❤️", "💖", "🥰", "💕"][Math.floor(Math.random() * 4)];
      heart.style.left = Math.random() * 95 + "vw";
      heart.style.fontSize = (18 + Math.random() * 18) + "px";
      heart.style.animationDuration = (3 + Math.random() * 3) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }

    setInterval(spawnHeart, 900);
  </script>

</body>
</html>
