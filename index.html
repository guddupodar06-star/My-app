<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Repeater Tool — By Guddu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .app-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 22px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 24px;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    input, textarea, select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 15px;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .quick-btns {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .chip {
      background: #334155;
      color: #e2e8f0;
      border: none;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
    }

    .chip:hover {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
    }

    .btn-generate {
      width: 100%;
      padding: 12px;
      background: #22c55e;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-generate:hover {
      background: #16a34a;
    }

    .output-section {
      margin-top: 18px;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 13px;
      color: #94a3b8;
    }

    textarea#outputText {
      min-height: 150px;
      resize: vertical;
      line-height: 1.5;
    }

    .action-btns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-action {
      padding: 10px;
      border: none;
      border-radius: 7px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
    }

    .btn-copy {
      background: #2563eb;
    }

    .btn-copy:hover {
      background: #1d4ed8;
    }

    .btn-wa {
      background: #16a34a;
    }

    .btn-wa:hover {
      background: #15803d;
    }

    .btn-clear {
      background: #ef4444;
    }

    .btn-clear:hover {
      background: #dc2626;
    }

    .footer-note {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="app-box">
    <h1>Text Repeater</h1>
    <p class="subtitle">Koi bhi text ya emoji likhein aur jitni baar chahein repeat karein</p>

    <div class="form-group">
      <label for="inputText">Apna Text ya Emoji Likhein</label>
      <input type="text" id="inputText" placeholder="Jaise: Sorry 😅 ya Happy Birthday 🎉" />
    </div>

    <div class="row">
      <div class="form-group">
        <label for="repeatCount">Kitni Baar Repeat Karna Hai?</label>
        <input type="number" id="repeatCount" min="1" max="5000" value="10" />
      </div>

      <div class="form-group">
        <label for="separator">Bech Mein Kya Aaye?</label>
        <select id="separator">
          <option value="newline">New Line (Har baar nayi line)</option>
          <option value="space">Space (Ek space ke saath)</option>
          <option value="comma">Comma (, )</option>
          <option value="none">Kuch Nahi (Chipak kar)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <div class="quick-btns">
        <button type="button" class="chip" onclick="setCount(10)">10x</button>
        <button type="button" class="chip" onclick="setCount(50)">50x</button>
        <button type="button" class="chip" onclick="setCount(100)">100x</button>
        <button type="button" class="chip" onclick="setCount(500)">500x</button>
        <button type="button" class="chip" onclick="setCount(1000)">1000x</button>
      </div>
    </div>

    <button class="btn-generate" onclick="generateText()">Repeat Karein</button>

    <div class="output-section">
      <div class="output-header">
        <span>Result:</span>
        <span id="charCount">0 characters</span>
      </div>
      <textarea id="outputText" readonly placeholder="Yahan aapka repeated text dikhega..."></textarea>

      <div class="action-btns">
        <button class="btn-action btn-copy" onclick="copyText()">Copy</button>
        <button class="btn-action btn-wa" onclick="shareWhatsApp()">WhatsApp</button>
        <button class="btn-action btn-clear" onclick="clearAll()">Clear</button>
      </div>
    </div>

    <div class="footer-note">Made by Guddu</div>
  </div>

  <script>
    function setCount(num) {
      document.getElementById("repeatCount").value = num;
    }

    function generateText() {
      const text = document.getElementById("inputText").value;
      const count = parseInt(document.getElementById("repeatCount").value, 10);
      const sepType = document.getElementById("separator").value;

      if (!text) {
        alert("Pehle koi text ya emoji likhein!");
        return;
      }

      if (isNaN(count) || count < 1 || count > 5000) {
        alert("Kripya 1 se 5000 ke beech ka number daalein!");
        return;
      }

      let sep = "\n";
      if (sepType === "space") sep = " ";
      if (sepType === "comma") sep = ", ";
      if (sepType === "none") sep = "";

      const result = Array(count).fill(text).join(sep);
      const outputEl = document.getElementById("outputText");
      outputEl.value = result;
      document.getElementById("charCount").innerText = result.length + " characters";
    }

    function copyText() {
      const output = document.getElementById("outputText").value;
      if (!output) {
        alert("Copy karne ke liye pehle text generate karein!");
        return;
      }

      navigator.clipboard.writeText(output).then(() => {
        alert("Text copy ho gaya! Ab kahin bhi paste karein.");
      }).catch(() => {
        const el = document.getElementById("outputText");
        el.select();
        document.execCommand("copy");
        alert("Text copy ho gaya!");
      });
    }

    function shareWhatsApp() {
      const output = document.getElementById("outputText").value;
      if (!output) {
        alert("Share karne ke liye pehle text generate karein!");
        return;
      }
      const url = "https://wa.me/?text=" + encodeURIComponent(output);
      window.open(url, "_blank");
    }

    function clearAll() {
      document.getElementById("inputText").value = "";
      document.getElementById("outputText").value = "";
      document.getElementById("charCount").innerText = "0 characters";
    }
  </script>

</body>
</html>
