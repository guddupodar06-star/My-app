<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product & Address Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    .form-box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
    .product-card {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
      background-color: #dc3545;
      width: auto;
      padding: 6px 12px;
      font-size: 14px;
    }
    .delete-btn:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>

  <div class="form-box">
    <h2>Product aur Address Add Karein</h2>
    <input type="text" id="productName" placeholder="Product ka naam (jaise: Wireless Mouse)" required>
    <input type="number" id="productPrice" placeholder="Price (₹ mein)" required>
    <textarea id="productAddress" rows="3" placeholder="Product / Delivery Address likhein..." required></textarea>
    <button onclick="addProduct()">Product Save Karein</button>
  </div>

  <h3>Saved Products List:</h3>
  <div id="productList"></div>

  <script>
    // Page load hote hi purane saved products dikhayein
    document.addEventListener("DOMContentLoaded", displayProducts);

    function addProduct() {
      const name = document.getElementById("productName").value.trim();
      const price = document.getElementById("productPrice").value.trim();
      const address = document.getElementById("productAddress").value.trim();

      if (!name || !price || !address) {
        alert("Kripya saari details bharein!");
        return;
      }

      const product = { id: Date.now(), name, price, address };
      
      // Purana data nikal kar naya product add karein
      let products = JSON.parse(localStorage.getItem("myProducts")) || [];
      products.push(product);
      localStorage.setItem("myProducts", JSON.stringify(products));

      // Form khali karein
      document.getElementById("productName").value = "";
      document.getElementById("productPrice").value = "";
      document.getElementById("productAddress").value = "";

      displayProducts();
    }

    function displayProducts() {
      const list = document.getElementById("productList");
      const products = JSON.parse(localStorage.getItem("myProducts")) || [];
      list.innerHTML = "";

      products.forEach(item => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <div>
            <strong>${item.name}</strong> - ₹${item.price}<br>
            <small><b>Address:</b> ${item.address}</small>
          </div>
          <button class="delete-btn" onclick="deleteProduct(${item.id})">Delete</button>
        `;
        list.appendChild(card);
      });
    }

    function deleteProduct(id) {
      let products = JSON.parse(localStorage.getItem("myProducts")) || [];
      products = products.filter(item => item.id !== id);
      localStorage.setItem("myProducts", JSON.stringify(products));
      displayProducts();
    }
  </script>

</body>
</html>
