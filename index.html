<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Special Surprise For You ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #360922 0%, #0d0612 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Floating background hearts */
    .bg-heart {
      position: fixed;
      bottom: -35px;
      opacity: 0.7;
      animation: floatUp linear forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg) scale(0.85); opacity: 0.75; }
      100% { transform: translateY(-115vh) rotate(25deg) scale(1.25); opacity: 0; }
    }

    /* Stage 1: Gift Box */
    .gift-stage {
      text-align: center;
      cursor: pointer;
      z-index: 5;
      transition: transform 0.3s ease, opacity 0.45s ease;
    }

    .gift-stage:active {
      transform: scale(0.95);
    }

    .gift-box {
      position: relative;
      width: 154px;
      height: 154px;
      margin: 0 auto 22px;
      animation: bounceBox 1.5s infinite ease-in-out;
    }

    @keyframes bounceBox {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-11px) rotate(-3deg); }
      75% { transform: translateY(-7px) rotate(3deg); }
    }

    .lid {
      position: absolute;
      top: 0;
      left: -8px;
      width: 170px;
      height: 38px;
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      border-radius: 9px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      z-index: 3;
      transition: transform 0.6s ease, opacity 0.5s ease;
    }

    .lid::before {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 100%;
      background: #ffd166;
    }

    .bow {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 34px;
      z-index: 4;
      transition: transform 0.6s ease, opacity 0.5s ease;
    }

    .box-body {
      position: absolute;
      top: 36px;
      left: 0;
      width: 154px;
      height: 118px;
      background: linear-gradient(135deg, #ff758f, #d90429);
      border-radius: 0 0 12px 12px;
      box-shadow: 0 16px 36px rgba(255, 77, 109, 0.45);
    }

    .box-body::before {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 100%;
      background: #ffd166;
    }

    .gift-open .lid {
      transform: translateY(-75px) rotate(-20deg);
      opacity: 0;
    }

    .gift-open .bow {
      transform: translate(-50%, -90px) scale(1.35);
      opacity: 0;
    }

    .tap-text {
      font-size: 21px;
      font-weight: 700;
      color: #ffccd5;
      letter-spacing: 0.4px;
    }

    .tap-sub {
      font-size: 13.5px;
      color: #cbd5e1;
      margin-top: 6px;
    }

    /* Stage 2: Love / Hate Card */
    .card-stage {
      display: none;
      background: rgba(28, 14, 34, 0.94);
      border: 1px solid rgba(255, 117, 143, 0.45);
      border-radius: 22px;
      padding: 26px 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 16px 42px rgba(255, 77, 109, 0.32);
      animation: popIn 0.45s ease forwards;
      position: relative;
      z-index: 5;
    }

    @keyframes popIn {
      0% { transform: scale(0.65); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .big-heart {
      font-size: 52px;
      margin-bottom: 8px;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .card-stage h2 {
      font-size: 22px;
      color: #ffccd5;
      margin-bottom: 6px;
    }

    .card-stage p {
      font-size: 14px;
      color: #e2e8f0;
      margin-bottom: 18px;
    }

    .btn-arena {
      position: relative;
      height: 165px;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 143, 163, 0.25);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      overflow: hidden;
    }

    .btn {
      padding: 11px 18px;
      border: none;
      border-radius: 50px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.14s ease;
    }

    .btn-love {
      background: linear-gradient(135deg, #ff4d6d, #ff0a54);
      color: #fff;
      box-shadow: 0 6px 18px rgba(255, 10, 84, 0.45);
      z-index: 2;
    }

    .btn-love:active {
      transform: scale(0.94);
    }

    .btn-hate {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #64748b;
      position: relative;
      z-index: 5;
      transition: left 0.14s ease-out, top 0.14s ease-out;
    }

    .tease-msg {
      font-size: 13px;
      color: #ff8fa3;
      min-height: 22px;
      margin-top: 10px;
      font-weight: 600;
    }

    /* Stage 3: Final Celebration */
    .final-stage {
      display: none;
      text-align: center;
      background: rgba(28, 14, 34, 0.96);
      border: 1px solid #ff4d6d;
      border-radius: 22px;
      padding: 30px 22px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 16px 42px rgba(255, 77, 109, 0.42);
      animation: popIn 0.45s ease forwards;
      z-index: 5;
    }

    .final-stage h2 {
      font-size: 25px;
      color: #ff8fa3;
      margin: 10px 0 8px;
    }

    .final-stage p {
      font-size: 14.5px;
      color: #f8fafc;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .final-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-sec {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid #64748b;
      background: #1e293b;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-copy-love {
      background: #2563eb;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Stage 1: Gift Box -->
  <div class="gift-stage" id="giftStage" onclick="openGift()">
    <div class="gift-box" id="giftBox">
      <div class="bow">🎀</div>
      <div class="lid"></div>
      <div class="box-body"></div>
    </div>
    <div class="tap-text" id="giftHeading">Ek Surprise Gift Hai! 🎁</div>
    <div class="tap-sub">Kholne ke liye box par tap karein</div>
  </div>

  <!-- Stage 2: Interactive Card -->
  <div class="card-stage" id="cardStage">
    <div class="big-heart">💖</div>
    <h2 id="cardTitle">Sach-Sach Batana...</h2>
    <p>Tumhare dil mein mere liye kya hai?</p>

    <div class="btn-arena" id="arena">
      <button class="btn btn-love" id="loveBtn" onclick="chooseLove()">I Love You ❤️</button>
      <button class="btn btn-hate" id="hateBtn">I Hate You 💔</button>
    </div>

    <div class="tease-msg" id="teaseMsg"></div>
  </div>

  <!-- Stage 3: Final Message -->
  <div class="final-stage" id="finalStage">
    <div style="font-size: 58px;">🥰❤️🎉</div>
    <h2 id="finalTitle">I Love You Too!</h2>
    <p id="finalMsg">Mujhe pehle se pata tha tum yahi chunoge! Tum mere liye bahut special ho. ❤️</p>
    <div class="final-actions">
      <button class="btn-sec btn-copy-love" onclick="copyLoveReply()">Copy Reply</button>
      <button class="btn-sec" onclick="replayGift()">Dobara Dekhein</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const customName = (params.get("to") || "").trim();

    if (customName) {
      document.getElementById("giftHeading").innerText = `${customName} Ke Liye Ek Gift Hai! 🎁`;
      document.getElementById("cardTitle").innerText = `${customName}, Sach Batana...`;
      document.getElementById("finalTitle").innerText = `I Love You Too, ${customName}!`;
    }

    const teaseLines = [
      "Arre! Yeh button pakad mein nahi aayega 😜",
      "Nice try! Dusra wala dabao ❤️",
      "Yeh option lock ho chuka hai 😂",
      "Bhaag raha hai dekho! I Love You dabao 🏃‍♂️💨",
      "Koshish achhi thi, par click nahi hoga 🥰"
    ];
    let teaseIndex = 0;
    let lastX = -1;
    let lastY = -1;

    function openGift() {
      const box = document.getElementById("giftBox");
      box.classList.add("gift-open");
      burstHearts(10);

      setTimeout(() => {
        document.getElementById("giftStage").style.display = "none";
        document.getElementById("cardStage").style.display = "block";
      }, 520);
    }

    const hateBtn = document.getElementById("hateBtn");
    const arena = document.getElementById("arena");

    function dodgeButton(e) {
      if (e) e.preventDefault();

      const pad = 10;
      const maxX = Math.max(pad, arena.clientWidth - hateBtn.offsetWidth - pad);
      const maxY = Math.max(pad, arena.clientHeight - hateBtn.offsetHeight - pad);

      let randomX = pad;
      let randomY = pad;

      // Har baar pichli jagah se thoda alag position chunein
      for (let attempt = 0; attempt < 8; attempt++) {
        randomX = Math.floor(pad + Math.random() * (maxX - pad + 1));
        randomY = Math.floor(pad + Math.random() * (maxY - pad + 1));
        if (Math.hypot(randomX - lastX, randomY - lastY) > 45) break;
      }

      lastX = randomX;
      lastY = randomY;

      hateBtn.style.position = "absolute";
      hateBtn.style.left = randomX + "px";
      hateBtn.style.top = randomY + "px";

      document.getElementById("teaseMsg").innerText = teaseLines[teaseIndex % teaseLines.length];
      teaseIndex++;
    }

    hateBtn.addEventListener("touchstart", dodgeButton, { passive: false });
    hateBtn.addEventListener("mouseover", dodgeButton);
    hateBtn.addEventListener("click", dodgeButton);

    function chooseLove() {
      document.getElementById("cardStage").style.display = "none";
      document.getElementById("finalStage").style.display = "block";
      burstHearts(28);
    }

    function copyLoveReply() {
      const text = `${document.getElementById("finalTitle").innerText} ${document.getElementById("finalMsg").innerText}`;
      navigator.clipboard.writeText(text).then(() => {
        alert("Message copy ho gaya!");
      }).catch(() => {
        alert("Copy nahi ho paaya.");
      });
    }

    function replayGift() {
      document.getElementById("finalStage").style.display = "none";
      document.getElementById("cardStage").style.display = "none";
      document.getElementById("giftStage").style.display = "block";

      const box = document.getElementById("giftBox");
      box.classList.remove("gift-open");

      hateBtn.style.position = "relative";
      hateBtn.style.left = "auto";
      hateBtn.style.top = "auto";
      lastX = -1;
      lastY = -1;
      teaseIndex = 0;
      document.getElementById("teaseMsg").innerText = "";
    }

    function spawnHeart() {
      const heart = document.createElement("div");
      heart.className = "bg-heart";
      heart.innerText = ["❤️", "💖", "🥰", "💕", "✨"][Math.floor(Math.random() * 5)];
      heart.style.left = Math.random() * 94 + "vw";
      heart.style.fontSize = (18 + Math.random() * 18) + "px";
      heart.style.animationDuration = (3.2 + Math.random() * 2.8) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6200);
    }

    function burstHearts(count) {
      for (let i = 0; i < count; i++) {
        setTimeout(spawnHeart, i * 85);
      }
    }

    setInterval(spawnHeart, 950);
  </script>

</body>
</html>
